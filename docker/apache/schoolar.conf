<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName localhost

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- API lives next to public/ in the repo; expose it under /api ---
    Alias /api /var/www/html/api
    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # --- Compat: old /SCHOOlar/... bookmarks (XAMPP-style absolute URLs) ---
    # Strip the legacy prefix so /SCHOOlar/user/user-dashboard.php keeps working.
    RedirectMatch ^/SCHOOlar$ /
    RedirectMatch ^/SCHOOlar/(.*)$ /$1

    # --- Security headers ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Block direct access to sensitive paths ---
    <DirectoryMatch "^/var/www/html/_old_backend_unused">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/html/api/config">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.sql$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.git">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/schoolar_error.log
    CustomLog ${APACHE_LOG_DIR}/schoolar_access.log combined
</VirtualHost>

# --- public/ layout (canonical browser UI) ---
# All browser-facing pages live under public/ (lowercase user/, admin/ subfolders).
# Guarded pages are *.php (server-enforced via api/config/guard.php); legacy
# *.html twins redirect to their *.php copy via public/.htaccess, except the
# real static pages (index.html, login.html, register.html, admin/admin-login.html).
